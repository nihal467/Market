name: Refinement PR Pipeline (Claude Code, Max OAuth)

# Daily at 18:00 IST (12:30 UTC), for the open "daily-refinement" issue:
#   1. propose  - Claude Code opens a PR (or closes the issue if no change)
#   2. security - Python scanner gates the PR (secrets / sensitive data)
#   3. review   - Claude Code independently reviews the PR
#   4. merge    - squash-merge if security passed AND review approved
#
# Auth: your Max plan via CLAUDE_CODE_OAUTH_TOKEN (no API billing).
# Requires the Claude GitHub App installed on the repo: https://github.com/apps/claude
# GitHub cron is best-effort; use "Run workflow" to trigger on demand.

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC == 18:00 IST
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Refinement issue number to process (blank = latest open one)"
        required: false
      auto_merge:
        description: "Merge approved PRs automatically"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write        # required by claude-code-action (OIDC token exchange)

concurrency:
  group: refinement-pipeline
  cancel-in-progress: false

jobs:
  refine:
    # Only the repo owner can run this (manually or via schedule). External
    # actors cannot dispatch it; this also blocks other collaborators.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      FAIL_ON: HIGH
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve auto-merge flag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.auto_merge }}" = "false" ]; then
            echo "AUTO_MERGE=0" >> "$GITHUB_ENV"
          else
            echo "AUTO_MERGE=1" >> "$GITHUB_ENV"
          fi

      - name: Ensure labels exist
        run: python scripts/ensure_labels.py

      - name: Find refinement issue (author-allowlisted)
        id: issue
        run: |
          set -e
          OWNER="${{ github.repository_owner }}"
          N="${{ inputs.issue_number }}"
          if [ -z "$N" ]; then
            N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --label daily-refinement --json number \
                  --jq 'max_by(.number).number // empty')
          fi
          if [ -z "$N" ]; then echo "No open daily-refinement issue."; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          AUTHOR=$(gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')
          echo "Issue #$N author: $AUTHOR"
          case "$AUTHOR" in
            "$OWNER"|"github-actions[bot]"|"app/github-actions"|"claude[bot]")
              echo "number=$N" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Author '$AUTHOR' not allowlisted — skipping."
              echo "number=" >> "$GITHUB_OUTPUT" ;;
          esac

      # ---------------------------------------------------------------- propose
      - name: Propose fix (Claude Code)
        id: propose
        if: steps.issue.outputs.number != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are doing the DAILY post-market refinement for issue
            #${{ steps.issue.outputs.number }} in ${{ github.repository }}.
            This is a personal PAPER-trading (dummy money) system.

            RULES (a violation is a failure):
            - Evidence-backed only. Cite specific data from the issue (paper P&L,
              incubation gate, backtest lab, signal counts, regime). If the data
              does NOT clearly justify a change, make NO change. "No change" is
              the correct answer on most days.
            - Any change must be SMALL, testable, and PAPER-ONLY. Do not add
              strategy parameters at random. Keep it to a few files / a few
              hundred lines at most.
            - Preserve the one-month incubation rule and readiness gate. Never
              enable/recommend real-money trading.
            - NEVER modify .github/, holdings.yaml, or any secret. NEVER put
              rupee amounts, holdings figures (units/invested/quantity), keys,
              or personal data into code.
            - Validate before finishing:
              python -m unittest discover -s tests -p "test_*.py"

            IF a small, justified change exists:
              1. Create a branch off main named
                 auto-refine/issue-${{ steps.issue.outputs.number }}-<YYYY-MM-DD>
              2. Make the minimal edit(s), run the tests, commit, push.
              3. Open a pull request whose body explains the change and its
                 evidence and ENDS with a line: Closes #${{ steps.issue.outputs.number }}
              4. Add the label "auto-refinement" to that PR.
              5. Return structured output: action="opened_pr", pr_number=<number>,
                 branch=<branch>, summary=<one line>.
            ELSE (no justified change):
              1. Comment on issue #${{ steps.issue.outputs.number }} explaining,
                 with evidence, why no code change is warranted.
              2. Close the issue.
              3. Return structured output: action="no_change", summary=<one line>.
          claude_args: |
            --model ${{ vars.PROPOSER_MODEL || 'sonnet' }}
            --allowedTools Edit,Read,Write,Bash
            --max-turns 30
            --json-schema '{"type":"object","properties":{"action":{"type":"string","enum":["opened_pr","no_change"]},"pr_number":{"type":"number"},"branch":{"type":"string"},"summary":{"type":"string"}},"required":["action"]}'

      - name: Parse propose result
        id: p
        if: steps.issue.outputs.number != ''
        run: |
          OUT='${{ steps.propose.outputs.structured_output }}'
          echo "raw structured_output: $OUT"
          echo "action=$(echo "$OUT" | jq -r '.action // "no_change"')" >> "$GITHUB_OUTPUT"
          echo "pr=$(echo "$OUT" | jq -r '.pr_number // empty')" >> "$GITHUB_OUTPUT"
          echo "summary=$(echo "$OUT" | jq -r '.summary // ""')" >> "$GITHUB_OUTPUT"

      # Make the "no change" outcome visible and deterministic (don't rely on the
      # model to comment/close). Closes the issue with the reasoning.
      - name: Handle no-change (comment + close)
        if: steps.issue.outputs.number != '' && steps.p.outputs.action != 'opened_pr'
        run: |
          MSG="${{ steps.p.outputs.summary }}"
          [ -z "$MSG" ] && MSG="No evidence-backed change warranted today; system left unchanged."
          gh issue comment ${{ steps.issue.outputs.number }} --repo "$GITHUB_REPOSITORY" \
            --body "🤖 **Daily refinement — no code change today.** $MSG"
          gh issue close ${{ steps.issue.outputs.number }} --repo "$GITHUB_REPOSITORY"
          echo "Commented + closed issue #${{ steps.issue.outputs.number }} (no change)."

      # Defense-in-depth: only ever act on a PR WE created (auto-refine/* branch),
      # never an external PR that happens to exist.
      - name: Verify PR ownership
        id: own
        if: steps.p.outputs.action == 'opened_pr' && steps.p.outputs.pr != ''
        run: |
          REF=$(gh pr view ${{ steps.p.outputs.pr }} --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
          echo "PR head branch: $REF"
          case "$REF" in
            auto-refine/*) echo "ok=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "PR branch '$REF' is not ours — refusing to touch."; echo "ok=0" >> "$GITHUB_OUTPUT" ;;
          esac

      # --------------------------------------------------------------- security
      - name: Security scan (gate)
        if: steps.own.outputs.ok == '1'
        run: python scripts/security_scan.py --pr ${{ steps.p.outputs.pr }}

      # ============================ REVIEW ⇄ FIX loop (up to 3 cycles) =========
      # review1 -> (fix -> rescan -> review2) -> (fix -> rescan -> review3)
      #         -> (fix -> rescan -> review4) -> merge on any approval.
      # Each stage runs only if the previous review requested changes.

      - name: Review 1 (Opus)
        id: review1
        if: steps.own.outputs.ok == '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Independently review pull request #${{ steps.p.outputs.pr }} in
            ${{ github.repository }}. Do NOT assume it is correct; re-derive it.
            It came from a daily PAPER-trading refinement issue.

            Approve ONLY if ALL hold:
            - Genuinely justified by the issue's evidence.
            - Small, paper-only; does not enable real-money trading or weaken the
              incubation / readiness gate.
            - Touches no protected files (.github/, holdings.yaml, secrets) and
              leaks no sensitive data (rupee amounts, holdings figures, keys, PII).
            - Tests pass: run `python -m unittest discover -s tests -p "test_*.py"`.
              Verify by reading files and running commands — do not trust claims.

            Submit a GitHub review: APPROVE if all hold, else REQUEST_CHANGES with
            specific, actionable reasons. Return: decision, summary.
          claude_args: |
            --model ${{ vars.REVIEWER_MODEL || 'opus' }}
            --allowedTools Read,Bash
            --max-turns 20
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["decision"]}'

      # -------- cycle 1
      - name: Fix 1 (Sonnet)
        if: >
          steps.p.outputs.pr != '' && steps.review1.outputs.structured_output != '' &&
          fromJSON(steps.review1.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The reviewer requested changes on PR #${{ steps.p.outputs.pr }} in
            ${{ github.repository }}. Read the latest review comments and address
            them with the SAME rules (small, evidence-backed, paper-only, no
            real-money, no protected-file edits, no sensitive data). Run
            `python -m unittest discover -s tests -p "test_*.py"`. Commit and push
            to the SAME PR branch (do not open a new PR). If the concerns can't be
            resolved with a small safe change, make no change and say why in a PR
            comment.
          claude_args: |
            --model ${{ vars.PROPOSER_MODEL || 'sonnet' }}
            --allowedTools Edit,Read,Write,Bash
            --max-turns 30
      - name: Scan 1
        if: >
          steps.p.outputs.pr != '' && steps.review1.outputs.structured_output != '' &&
          fromJSON(steps.review1.outputs.structured_output).decision == 'request_changes'
        run: python scripts/security_scan.py --pr ${{ steps.p.outputs.pr }}
      - name: Review 2 (Opus)
        id: review2
        if: >
          steps.p.outputs.pr != '' && steps.review1.outputs.structured_output != '' &&
          fromJSON(steps.review1.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Re-review PR #${{ steps.p.outputs.pr }} in ${{ github.repository }}
            after the author addressed your feedback. Same approval criteria;
            verify tests with `python -m unittest discover -s tests -p "test_*.py"`.
            Submit a GitHub review (APPROVE / REQUEST_CHANGES). Return: decision,
            summary.
          claude_args: |
            --model ${{ vars.REVIEWER_MODEL || 'opus' }}
            --allowedTools Read,Bash
            --max-turns 20
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["decision"]}'

      # -------- cycle 2
      - name: Fix 2 (Sonnet)
        if: >
          steps.p.outputs.pr != '' && steps.review2.outputs.structured_output != '' &&
          fromJSON(steps.review2.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The reviewer requested changes on PR #${{ steps.p.outputs.pr }} in
            ${{ github.repository }}. Read the latest review comments and address
            them with the SAME rules (small, evidence-backed, paper-only, no
            real-money, no protected-file edits, no sensitive data). Run
            `python -m unittest discover -s tests -p "test_*.py"`. Commit and push
            to the SAME PR branch (do not open a new PR). If the concerns can't be
            resolved with a small safe change, make no change and say why in a PR
            comment.
          claude_args: |
            --model ${{ vars.PROPOSER_MODEL || 'sonnet' }}
            --allowedTools Edit,Read,Write,Bash
            --max-turns 30
      - name: Scan 2
        if: >
          steps.p.outputs.pr != '' && steps.review2.outputs.structured_output != '' &&
          fromJSON(steps.review2.outputs.structured_output).decision == 'request_changes'
        run: python scripts/security_scan.py --pr ${{ steps.p.outputs.pr }}
      - name: Review 3 (Opus)
        id: review3
        if: >
          steps.p.outputs.pr != '' && steps.review2.outputs.structured_output != '' &&
          fromJSON(steps.review2.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Re-review PR #${{ steps.p.outputs.pr }} in ${{ github.repository }}
            after the author addressed your feedback. Same approval criteria;
            verify tests with `python -m unittest discover -s tests -p "test_*.py"`.
            Submit a GitHub review (APPROVE / REQUEST_CHANGES). Return: decision,
            summary.
          claude_args: |
            --model ${{ vars.REVIEWER_MODEL || 'opus' }}
            --allowedTools Read,Bash
            --max-turns 20
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["decision"]}'

      # -------- cycle 3
      - name: Fix 3 (Sonnet)
        if: >
          steps.p.outputs.pr != '' && steps.review3.outputs.structured_output != '' &&
          fromJSON(steps.review3.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The reviewer requested changes on PR #${{ steps.p.outputs.pr }} in
            ${{ github.repository }}. Read the latest review comments and address
            them with the SAME rules (small, evidence-backed, paper-only, no
            real-money, no protected-file edits, no sensitive data). Run
            `python -m unittest discover -s tests -p "test_*.py"`. Commit and push
            to the SAME PR branch (do not open a new PR). If the concerns can't be
            resolved with a small safe change, make no change and say why in a PR
            comment.
          claude_args: |
            --model ${{ vars.PROPOSER_MODEL || 'sonnet' }}
            --allowedTools Edit,Read,Write,Bash
            --max-turns 30
      - name: Scan 3
        if: >
          steps.p.outputs.pr != '' && steps.review3.outputs.structured_output != '' &&
          fromJSON(steps.review3.outputs.structured_output).decision == 'request_changes'
        run: python scripts/security_scan.py --pr ${{ steps.p.outputs.pr }}
      - name: Review 4 (Opus)
        id: review4
        if: >
          steps.p.outputs.pr != '' && steps.review3.outputs.structured_output != '' &&
          fromJSON(steps.review3.outputs.structured_output).decision == 'request_changes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Re-review PR #${{ steps.p.outputs.pr }} in ${{ github.repository }}
            after the author addressed your feedback. Same approval criteria;
            verify tests with `python -m unittest discover -s tests -p "test_*.py"`.
            Submit a GitHub review (APPROVE / REQUEST_CHANGES). Return: decision,
            summary.
          claude_args: |
            --model ${{ vars.REVIEWER_MODEL || 'opus' }}
            --allowedTools Read,Bash
            --max-turns 20
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["decision"]}'

      # ------------------------------------------------------------------ merge
      - name: Merge if approved (any cycle)
        if: >
          steps.own.outputs.ok == '1' && env.AUTO_MERGE == '1' &&
          (
            (steps.review1.outputs.structured_output != '' && fromJSON(steps.review1.outputs.structured_output).decision == 'approve') ||
            (steps.review2.outputs.structured_output != '' && fromJSON(steps.review2.outputs.structured_output).decision == 'approve') ||
            (steps.review3.outputs.structured_output != '' && fromJSON(steps.review3.outputs.structured_output).decision == 'approve') ||
            (steps.review4.outputs.structured_output != '' && fromJSON(steps.review4.outputs.structured_output).decision == 'approve')
          )
        run: |
          gh pr merge ${{ steps.p.outputs.pr }} --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch
          echo "Merged PR #${{ steps.p.outputs.pr }}."

      - name: Note if still not approved after 3 cycles
        if: >
          steps.p.outputs.pr != '' && steps.review4.outputs.structured_output != '' &&
          fromJSON(steps.review4.outputs.structured_output).decision == 'request_changes'
        run: |
          gh pr comment ${{ steps.p.outputs.pr }} --repo "$GITHUB_REPOSITORY" \
            --body "🤖 Still not approved after 3 review/fix cycles — leaving open for a human."

      - name: Summary
        if: always()
        run: |
          echo "### Refinement pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue: ${{ steps.issue.outputs.number || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Proposer: ${{ steps.p.outputs.action || 'skipped' }} (PR ${{ steps.p.outputs.pr || '-' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review 1: ${{ steps.review1.outputs.structured_output || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review 2: ${{ steps.review2.outputs.structured_output || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review 3: ${{ steps.review3.outputs.structured_output || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review 4: ${{ steps.review4.outputs.structured_output || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto-merge: ${AUTO_MERGE}" >> "$GITHUB_STEP_SUMMARY"
