name: Daily Investment Update

on:
  schedule:
    # 10:30 UTC = 16:00 IST, after NSE close (Mon-Fri).
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        run: python src/run_daily.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: daily dashboard update [skip ci]"
            git push
          fi

      # Dashboard is a self-contained HTML file. Download it from this run's
      # artifacts, or `git pull` and open docs/index.html locally.
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/index.html
