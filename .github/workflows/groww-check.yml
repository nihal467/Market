name: Groww Diagnostic

# One-click connectivity check for the Groww real-time data path.
# Runs src/groww_diag.py which prints a masked, step-by-step trace (token mint
# status, LTP status, response shape) so we can see exactly why the bot does or
# does not get real-time prices. Secrets are masked — safe to read in logs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Groww diagnostic
        env:
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
        run: python src/groww_diag.py
