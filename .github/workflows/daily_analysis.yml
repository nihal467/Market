name: Daily Analysis

# Full end-of-day analysis over the Top-50 watchlist with day-over-day change
# detection (signal flips, RSI regime changes). Runs after close and again
# overnight so the morning view reflects the latest 24h.
# Cloudflare Worker `market-intraday-watchdog` dispatches this at:
#   16:30 IST Mon-Fri (post-close)
#   01:00 IST Tue-Sat (overnight refresh)
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  # Keep end-of-day analysis serialized, but do not queue it behind the
  # long-running intraday monitor. Data-branch push conflicts are retried below.
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Daily analysis
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/daily_analysis.py

      - name: Paper trade (virtual Rs 5L)
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/paper_trader.py

      - name: Incubation readiness report
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/incubation_report.py

      # Advisory: archive today's per-symbol headlines + lexicon sentiment to
      # the data branch (news/YYYY/MM/DD.json) so future signal-quality
      # studies — e.g. the backtest's news ablation — can replay a DATED news
      # history. Runs after the trading steps and must never break them.
      - name: News archive (advisory)
        continue-on-error: true
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/news_archive.py

      # If the paper book's drawdown circuit-breaker is active, raise (or
      # update) a single ops-alert issue so a human actually notices. Advisory
      # only — a failure here never blocks the data publish below.
      - name: Circuit-breaker alert
        continue-on-error: true
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY' > /tmp/cb.env
          import json, os
          path = os.path.join(os.environ["MARKET_DATA_DIR"], "paper", "latest.json")
          tripped = False
          try:
              with open(path, encoding="utf-8") as fh:
                  tripped = json.load(fh).get("circuit_breaker") is True
          except (OSError, ValueError):
              pass
          print(f"CIRCUIT_BREAKER={'true' if tripped else 'false'}")
          PY
          cat /tmp/cb.env
          . /tmp/cb.env
          if [ "$CIRCUIT_BREAKER" = "true" ]; then
            python scripts/ops_alert.py --source "circuit-breaker" \
              --detail "Paper book drawdown circuit-breaker is ACTIVE (book >= 15% below peak; new buys paused). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Circuit breaker not tripped."
          fi

      - name: Commit & push data
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "data: daily analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            echo "push retry $i"; sleep $((RANDOM % 8 + 2))
          done
          echo "push failed after retries"; exit 1

      - name: Ops alert on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ops_alert.py --source "Daily Analysis" \
            --detail "Workflow run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
