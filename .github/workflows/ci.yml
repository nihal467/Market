name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Dashboard generation smoke test
        env:
          DASHBOARD_PASSWORD: ci-dashboard-password
        run: python src/dashboard.py

  workflows:
    name: Workflow YAML checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse GitHub workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "ok #{f}" }'

  cloudflare-worker:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/intraday-watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/intraday-watchdog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: node --check src/index.js

      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run
