name: Weekly Watchlist

# Builds the Top-50 stocks-to-watch from technicals + news, once a week.
# Cloudflare Worker `market-intraday-watchdog` dispatches this Sunday 17:30 IST
# for weekend prep before the coming week.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Serialize watchlist refreshes without waiting behind the long intraday loop.
# Push conflicts are still handled by the pull --rebase retry below.
concurrency:
  group: weekly-watchlist
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build watchlist
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/watchlist.py

      - name: Run backtest
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/backtest.py

      # Advisory sanity check: replay the backtest engine over the live paper
      # window and flag divergence. Never blocks the watchlist refresh.
      - name: Backtest-vs-live drift monitor (advisory)
        continue-on-error: true
        env:
          MARKET_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python src/drift_monitor.py

      - name: Commit & push data
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "data: weekly watchlist $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            echo "push retry $i"; sleep $((RANDOM % 8 + 2))
          done
          echo "push failed after retries"; exit 1

      - name: Ops alert on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ops_alert.py --source "Weekly Watchlist" \
            --detail "Workflow run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
